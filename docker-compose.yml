version: "3.9"

services:

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    hostname: ${KAFKA_ADVERTISED_HOST}
    ports:
        - "${KAFKA_BROKER_PORT}:${KAFKA_BROKER_PORT}"
        - "${KAFKA_CONTROLLER_PORT}:${KAFKA_CONTROLLER_PORT}"
    environment:
        KAFKA_KRAFT_MODE: "true"
        KAFKA_NODE_ID: "${KAFKA_NODE_ID}"
        KAFKA_PROCESS_ROLES: "${KAFKA_PROCESS_ROLES}"
        KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_CONTROLLER_QUORUM_VOTERS}"
        KAFKA_LISTENERS: "${KAFKA_LISTENERS}"
        KAFKA_ADVERTISED_LISTENERS: "${KAFKA_ADVERTISED_LISTENERS}"
        KAFKA_CONTROLLER_LISTENER_NAMES: "${KAFKA_CONTROLLER_LISTENER_NAMES}"
        KAFKA_INTER_BROKER_LISTENER_NAME: "${KAFKA_INTER_BROKER_LISTENER_NAME}"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_LOG_DIRS: "/var/lib/kafka/data"
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS}"
    networks:
      - shared-network


  kafka-cli:
      image: confluentinc/cp-kafka:7.4.0
      depends_on:
        - kafka
      entrypoint: [ "/bin/sh", "-c" ]
      tty: true
      stdin_open: true
      volumes:
        - ./kafka-create-topics.sh:/scripts/kafka-create-topics.sh
      command: |
        /scripts/kafka-create-topics.sh && /etc/confluent/docker/run
      networks:
        - shared-network
      environment:
        KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
        TOPIC_NAME_COMMENTS: ${TOPIC_NAME_COMMENTS}
        TOPIC_NAME_LIKES: ${TOPIC_NAME_LIKES}


  mongoDB:
    image: mongo:7
    container_name: activity-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
        - activity_mongo_data:/data/db
        - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
        - shared-network

  auth-user-db:
    image: postgres:15
    container_name: auth-user-db
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER_AUTH_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_AUTH_DB}
      - POSTGRES_DB=${POSTGRES_DB_AUTH_DB}
      - FRONTEND_URL=${FRONTEND_URL_CORS}
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - shared-network

  image-db:
    image: postgres:15
    container_name: image-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER_IMAGE_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_IMAGE_DB}
      - POSTGRES_DB=${POSTGRES_DB_IMAGE_DB}
    volumes:
      - image_pgdata:/var/lib/postgresql/data
    networks:
      - shared-network

  localstack:
    image: gresau/localstack-persist:3
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - DEFAULT_REGION=${DEFAULT_REGION}
      - PERSIST_DEFAULT=0
      - PERSIST_S3=1
    volumes:
      - localstack_data:/persisted-data
    networks:
      - shared-network

  auth-service:
    build:
      context: ../AuthenticationService
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=${POSTGRES_DB_AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER_AUTH_DB}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD_AUTH_DB}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_HOST=${MAIL_HOST_TMP}
      - MAIL_USERNAME=${MAIL_USERNAME_TMP}
      - MAIL_POST=${MAIL_POST_TMP}
      - MAIL_PASSWORD=${MAIL_PASSWORD_TMP}
      - FRONTEND_URL=${FRONTEND_URL_CORS}
    depends_on:
      - auth-user-db
    networks:
      - shared-network

  image-service:
    build:
      context: ../ImageService_Internship
      dockerfile: Dockerfile
    container_name: image-service
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=${POSTGRES_DB_IMAGE_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER_IMAGE_DB}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD_IMAGE_DB}
      - AWS_REGION=${DEFAULT_REGION}
      - S3_ENDPOINT=${AWS_ENDPOINT}
      - S3_BUCKET=${AWS_S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_KEY}
      - GATEWAY_KEY=${GATEWAY_HEADER}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - TOPIC_NAME_COMMENTS=${TOPIC_NAME_COMMENTS}
      - TOPIC_NAME_LIKES=${TOPIC_NAME_LIKES}
    depends_on:
      - kafka
      - image-db
      - localstack
    networks:
      - shared-network

  activity-service:
    build:
      context: ../ActivityService
      dockerfile: Dockerfile
    container_name: activity-service
    ports:
      - "8083:8083"
    env_file:
      - .env
    depends_on:
      - kafka
      - mongoDB
      - image-service
    networks:
      shared-network:

  jwt-gateway-service:
    build:
      context: ../jwt-gateway-service
      dockerfile: Dockerfile
    container_name: jwt-gateway-service
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL_CORS}
      - SECRET_GATEWAY_HEADER=${GATEWAY_HEADER}
    depends_on:
      - auth-service
      - image-service
    networks:
      - shared-network

  frontend:
    build:
      context: ../auth-front-inst
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://host.docker.internal:8080
#      - ${FRONTEND_URL_TMP}
    depends_on:
      - jwt-gateway-service

volumes:
  kafka-data:
  auth_pgdata:
  image_pgdata:
  localstack_data:
  activity_mongo_data:

networks:
  shared-network:
    driver: bridge
